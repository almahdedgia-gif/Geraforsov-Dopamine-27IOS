name: Build iOS Demo IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project CART3R_Dopamine_Demo.xcodeproj \
            -scheme CART3R_Dopamine_Demo \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Dopamine-Demo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Demo-IPA
          path: Dopamine-Demo.ipa
